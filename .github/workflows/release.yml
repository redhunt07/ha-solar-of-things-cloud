name: Release package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    name: Attach Home Assistant package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the integration archive
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/build_release.py --tag "$RELEASE_TAG"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
